name: Monitor estoque Copag B2B

# O agendamento saiu daqui: o GitHub entregava uma checagem a cada ~5 HORAS, nao a
# cada 5 min (medido em 88h: 23 execucoes de 1057 esperadas). Quem agenda agora e a
# Vercel, a cada 60s. Este workflow fica como reserva manual, para o caso de a
# Vercel cair. Ele usa o state.json do repo, que fica velho; ao rodar depois de
# muito tempo pode disparar um lote de alertas de itens que ja estavam disponiveis.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: monitor-estoque
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checar estoque e alertar
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 monitor.py

      - name: Gravar mudanças de estoque
        run: |
          set -u
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A state.json .heartbeat
          if git diff --cached --quiet; then
            echo "sem mudança de estoque"
            exit 0
          fi
          git commit -m "estoque: atualiza snapshot [skip ci]"
          for i in 1 2 3; do
            if git pull --rebase --autostash && git push; then
              echo "snapshot enviado"
              exit 0
            fi
            sleep 5
          done
          echo "falha ao enviar o snapshot" >&2
          exit 1
